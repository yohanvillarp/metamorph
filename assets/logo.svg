<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="metamorph-logo-fluid-wing" x1="25" y1="35" x2="100" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="metamorph-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0, 242, 254, 0.45)" />
    </filter>
  </defs>
  <g filter="url(#metamorph-logo-glow)">
    <!-- Sweeping Left Forewing -->
    <path d="M98 84 C84 48 50 26 24 36 C8 42 6 72 24 94 C44 118 80 114 98 92 Z" fill="url(#metamorph-logo-fluid-wing)" fill-opacity="0.4" stroke="#00f2fe" stroke-width="2.25" stroke-linejoin="round" />
    <!-- Left Hindwing Teardrop -->
    <path d="M98 100 C76 112 44 124 42 146 C40 166 64 174 80 160 C94 148 97 126 98 108 Z" fill="url(#metamorph-logo-fluid-wing)" fill-opacity="0.5" stroke="#0284c7" stroke-width="2" stroke-linejoin="round" />
    <!-- Sweeping Right Forewing -->
    <path d="M102 84 C116 48 150 26 176 36 C192 42 194 72 176 94 C156 118 120 114 102 92 Z" fill="url(#metamorph-logo-fluid-wing)" fill-opacity="0.4" stroke="#00f2fe" stroke-width="2.25" stroke-linejoin="round" />
    <!-- Right Hindwing Teardrop -->
    <path d="M102 100 C124 112 156 124 158 146 C160 166 136 174 120 160 C106 148 103 126 102 108 Z" fill="url(#metamorph-logo-fluid-wing)" fill-opacity="0.5" stroke="#0284c7" stroke-width="2" stroke-linejoin="round" />
    <!-- Internal Flight Rays -->
    <path d="M98 88 C76 68 50 50 36 58" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.65" />
    <path d="M102 88 C124 68 150 50 164 58" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" opacity="0.65" />
    <!-- Chrysalis Body Spine -->
    <path d="M100 50 C102 75 102 125 100 152 C98 125 98 75 100 50 Z" fill="#ffffff" />
    <!-- Antennas -->
    <path d="M99 48 Q95 34 86 28" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M101 48 Q105 34 114 28" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <circle cx="86" cy="28" r="1.5" fill="#ffffff" />
    <circle cx="114" cy="28" r="1.5" fill="#ffffff" />
    <circle cx="100" cy="50" r="2.5" fill="#00f2fe" />
  </g>
</svg>
