name: "💡 Feature Request"
description: Suggest an idea or new feature to improve the Metamorph CLI, Dashboard, or Swarm capabilities.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Metamorph even faster, smarter, or more extensible? We would love to hear it!

  - type: dropdown
    id: category
    attributes:
      label: Feature Area
      options:
        - "CLI Experience (Commands, options, spinners, terminal reporting)"
        - "Web Dashboard (UI, widgets, telemetry, charts, controls)"
        - "Swarm & Agent Architecture (Mozaik v4, prompt quality, review heuristics)"
        - "AST Tools & Transpilers (ts-morph, code generation accuracy)"
        - "Package Manager & Monorepo Support (pnpm, yarn, bun, workspaces)"
        - "Integrations & CI/CD"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Ideal Experience
      description: Describe how you envision this feature working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      options:
        - label: "I am willing to submit a Pull Request to implement this feature."
