name: PR Changeset Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: ["main", "develop"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-changeset:
    name: Verify Changeset Presence
    runs-on: ubuntu-latest
    steps:
      - name: Validate Changeset
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);
            const marker = '<!-- metamorph-changeset-bot -->';

            // Check if PR has the skip-changeset label
            const prLabels = (context.payload.pull_request.labels || []).map(l => l.name);
            const hasSkipLabel = prLabels.includes('skip-changeset');

            // Find existing bot sticky comment
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100
            });
            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (hasSkipLabel) {
              const skipBody = `${marker}\n> **⏭️ Changeset skipped**\n>\n> Latest commit: \`${commitSha}\`\n> The \`skip-changeset\` label was applied to this pull request. Automated changeset verification is bypassed.`;
              if (existingComment) {
                if (existingComment.body !== skipBody) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body: skipBody
                  });
                }
              }
              core.info('Bypassed due to skip-changeset label.');
              return;
            }

            // Fetch all changed files for this pull request
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100
            });

            const filenames = files.map(f => f.filename);

            // 1. Check if valid changeset markdown files exist in .changeset/
            const changesetFiles = files.filter(f => 
              f.filename.startsWith('.changeset/') &&
              f.filename.endsWith('.md') &&
              !f.filename.endsWith('README.md') &&
              f.status !== 'removed'
            );
            const hasChangeset = changesetFiles.length > 0;

            // 2. Check if the PR modifies package source code requiring a version bump
            const codePackagesPrefixes = ['packages/@nikelyh/', 'apps/dashboard/'];
            const ignoredExtensionsOrPatterns = [
              /\.test\.(ts|tsx|js|jsx)$/,
              /\.spec\.(ts|tsx|js|jsx)$/,
              /__tests__\//,
              /\.md$/,
              /^docs\//,
              /^\.github\//,
              /^\.agents\//,
              /^plans\//,
              /^scratch\//
            ];

            const modifiesPackageCode = filenames.some(filename => {
              const inCodePackage = codePackagesPrefixes.some(prefix => filename.startsWith(prefix));
              if (!inCodePackage) return false;
              const isIgnored = ignoredExtensionsOrPatterns.some(pattern => pattern.test(filename));
              return !isIgnored;
            });

            // Case A: No package code modified (docs, tests, CI, or internal tools only) -> Bypass
            if (!modifiesPackageCode) {
              if (existingComment) {
                const bypassBody = `${marker}\n> **ℹ️ Changeset not required**\n>\n> Latest commit: \`${commitSha}\`\n> This pull request only modifies documentation, tests, or workflow configuration. No changeset is required.`;
                if (existingComment.body !== bypassBody) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body: bypassBody
                  });
                }
              }
              core.info('PR modifies only documentation/tests/workflows. Changeset check bypassed.');
              return;
            }

            // Case B: Package code modified and changeset is present -> Render Rich Preview Table
            if (hasChangeset) {
              let rows = [];
              for (const csFile of changesetFiles) {
                try {
                  const { data: fileData } = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: csFile.filename,
                    ref: context.payload.pull_request.head.sha
                  });
                  if (fileData && fileData.content) {
                    const rawContent = Buffer.from(fileData.content, 'base64').toString('utf8');
                    const match = rawContent.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
                    if (match) {
                      const frontmatter = match[1].trim();
                      const summary = match[2].trim().replace(/\r?\n/g, ' ') || '*(No description provided)*';
                      if (!frontmatter) {
                        rows.push(`| *(empty)* | *none* | ${summary} |`);
                      } else {
                        const lines = frontmatter.split('\n');
                        for (const line of lines) {
                          const pkgMatch = line.match(/^["']?([^"':]+)["']?\s*:\s*(\w+)/);
                          if (pkgMatch) {
                            rows.push(`| \`${pkgMatch[1]}\` | \`${pkgMatch[2]}\` | ${summary} |`);
                          }
                        }
                      }
                    }
                  }
                } catch (err) {
                  core.warning(`Could not parse changeset file ${csFile.filename}: ${err.message}`);
                }
              }

              let tableSection = '';
              if (rows.length > 0) {
                tableSection = `\n\n| Package | Bump Level | Changelog Summary |\n| :--- | :---: | :--- |\n${rows.join('\n')}`;
              }

              // Check if PR links to a tracking issue (Fixes #123, Closes #123)
              const prBody = context.payload.pull_request.body || '';
              const issueLinkRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w-]+\/[\w-]+)?#\d+\b/i;
              const issueMatch = prBody.match(issueLinkRegex);
              const issueTip = issueMatch
                ? `\n\n> 🔗 **Linked Issue**: \`${issueMatch[0]}\``
                : `\n\n---\n> 💡 **Issue Tracking Tip**: No issue closing keyword detected (e.g. \`Fixes #123\`). If this PR addresses an existing issue, consider linking it so it closes automatically upon merging.`;

              const successBody = `${marker}\n> **✅ Changeset detected**\n>\n> Latest commit: \`${commitSha}\`\n> All package modifications in this pull request are covered by a changeset. Thank you!${tableSection}${issueTip}`;

              if (existingComment) {
                if (existingComment.body !== successBody) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body: successBody
                  });
                }
              }
              core.info('Changeset found in PR. Verification successful with rich preview.');
              return;
            }

            // Case C: Package code modified but changeset is missing -> Friendly Sticky Reminder
            const prBody = context.payload.pull_request.body || '';
            const issueLinkRegex = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w-]+\/[\w-]+)?#\d+\b/i;
            const issueMatch = prBody.match(issueLinkRegex);
            const issueTip = issueMatch
              ? `\n\n> 🔗 **Linked Issue**: \`${issueMatch[0]}\``
              : `\n\n---\n> 💡 **Issue Tracking Tip**: No issue closing keyword detected (e.g. \`Fixes #123\`). If this PR addresses an existing issue, consider linking it so it closes automatically upon merging.`;

            const reminderBody = `${marker}\n### ⚠️ No Changeset detected\n\nLatest commit: \`${commitSha}\`\n\nThis pull request modifies package source code in \`@nikelyh/*\` or \`apps/dashboard\`, but no changeset file was detected in \`.changeset/\`.\n\nTo ensure automatic semantic versioning and changelog generation upon merging, please add a changeset:\n\n\`\`\`bash\nnpm run changeset\n\`\`\`\n\nFollow the interactive prompts to select the affected package(s) and bump type (**patch** for fixes, **minor** for features). Commit the generated \`.changeset/*.md\` file to this branch to resolve this notice.\n\n---\n\n#### 💡 Non-release or Internal Changes\n- If this PR is purely internal refactoring or non-functional cleanup, generate an empty changeset:\n  \`\`\`bash\n  npx changeset --empty\n  \`\`\`\n- Or add the **\`skip-changeset\`** label to this pull request to bypass this check cleanly.\n\n*Note: This check is advisory and will not prevent builds or tests from running.*${issueTip}`;

            if (existingComment) {
              if (existingComment.body !== reminderBody) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body: reminderBody
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body: reminderBody
              });
            }

            core.notice('No changeset detected for package modifications. Posted reminder comment on PR.');
