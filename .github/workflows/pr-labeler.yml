name: PR Path Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-assign Area & Size Labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply Area Labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Calculate and Apply PR Size Label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;

            // Fetch pull request additions and deletions
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber
            });

            const totalChanges = (pr.additions || 0) + (pr.deletions || 0);

            let targetSize = 'size/M';
            if (totalChanges < 10) {
              targetSize = 'size/XS';
            } else if (totalChanges < 50) {
              targetSize = 'size/S';
            } else if (totalChanges < 200) {
              targetSize = 'size/M';
            } else if (totalChanges < 500) {
              targetSize = 'size/L';
            } else {
              targetSize = 'size/XL';
            }

            const sizeLabels = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];
            const currentLabels = (pr.labels || []).map(l => l.name);

            // Remove any outdated size labels
            for (const label of sizeLabels) {
              if (label !== targetSize && currentLabels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pullNumber,
                    name: label
                  });
                } catch (e) {
                  // Label may already be removed or concurrent request
                }
              }
            }

            // Add the new size label if not already present
            if (!currentLabels.includes(targetSize)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullNumber,
                labels: [targetSize]
              });
              core.info(`Applied size label: ${targetSize} (${totalChanges} lines changed)`);
            }
